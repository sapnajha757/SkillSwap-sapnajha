<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Swap Request | SkillSwap</title>

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/components.css">

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            Skill<span>Swap</span>
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="browse.html">
                Browse Skills
            </a>

            <a href="profile.html">
                My Profile
            </a>

            <a href="login.html">
                Logout
            </a>

        </div>

    </nav>



    <!-- =========================
         SWAP REQUEST
    ========================== -->

    <main class="auth-section">

        <div class="auth-container">

            <div class="auth-header">

                <p class="auth-tagline">
                    START A SKILL SWAP
                </p>

                <h1>
                    Send a <span>Swap Request</span>
                </h1>

                <p>
                    Tell your skill partner what you want to learn
                    and what you can teach in return.
                </p>

            </div>



            <!-- Selected User -->

            <div class="selected-user">

                <div class="profile-avatar">
                    A
                </div>

                <div>

                    <h3 id="receiver-name">
                        Aarav Sharma
                    </h3>

                    <p id="receiver-location">
                        Delhi
                    </p>

                </div>

            </div>



            <!-- Swap Form -->

            <form id="swap-form">


                <!-- Skill You Want -->

                <div class="form-group">

                    <label for="learn-skill">
                        What do you want to learn?
                    </label>

                    <input
                        type="text"
                        id="learn-skill"
                        list="learn-skills-list"
                        placeholder="Type or select any skill (e.g. React, Python, Hybrid RAG)"
                        required
                    >

                    <datalist id="learn-skills-list">
                        <option value="HTML">
                        <option value="CSS">
                        <option value="JavaScript">
                        <option value="Python">
                        <option value="React">
                        <option value="UI/UX">
                    </datalist>

                </div>



                <!-- Skill You Offer -->

                <div class="form-group">

                    <label for="teach-skill">
                        What can you teach in return?
                    </label>

                    <input
                        type="text"
                        id="teach-skill"
                        list="teach-skills-list"
                        placeholder="Type or select any skill (e.g. HTML, CSS, JavaScript)"
                        required
                    >

                    <datalist id="teach-skills-list">
                        <option value="HTML">
                        <option value="CSS">
                        <option value="JavaScript">
                        <option value="Python">
                        <option value="React">
                        <option value="UI/UX">
                    </datalist>

                </div>



                <!-- Message -->

                <div class="form-group">

                    <label for="swap-message">
                        Message
                    </label>

                    <textarea
                        id="swap-message"
                        rows="5"
                        placeholder="Introduce yourself and explain what you would like to learn..."
                        required
                    ></textarea>

                </div>



                <!-- Submit -->

                <button
                    type="submit"
                    class="btn primary-btn auth-btn"
                >
                    Send Swap Request
                </button>



                <!-- Message -->

                <p id="swap-message-status"></p>

            </form>


        </div>

    </main>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../JAVASCRIPT/auth.js"></script>
    <script src="../JAVASCRIPT/swap.js"></script>

</body>

</html>
